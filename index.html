<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Animation Algorithms</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
    }

    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas 84%);
      border-radius: 8px;
      color: LinkText;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      border-color: LinkText;
      outline: none;
      text-decoration: underline;
    }

    .status {
      padding: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas 84%);
      border-radius: 8px;
      color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Animation Algorithms</h1>
    <p>All algorithm animation pages available on this website.</p>
    <ul id="page-list" aria-label="HTML pages"></ul>
    <div id="status" class="status">Loading pages...</div>
  </main>

  <script>
    const pageList = document.querySelector("#page-list");
    const status = document.querySelector("#status");
    const fallbackPages = ["gravity.html"];
    const repoApiUrl = "https://api.github.com/repos/Khanguye/AI-Animation-Algorithms/contents/?ref=master";

    function pageTitle(fileName) {
      return fileName
        .replace(/\.html$/i, "")
        .split(/[-_]/)
        .filter(Boolean)
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    function renderPages(pages) {
      pageList.innerHTML = "";

      if (!pages.length) {
        status.hidden = false;
        status.textContent = "No pages were found.";
        return;
      }

      status.hidden = true;

      for (const page of pages) {
        const item = document.createElement("li");
        const link = document.createElement("a");

        link.href = page;
        link.textContent = pageTitle(page);
        item.append(link);
        pageList.append(item);
      }
    }

    async function loadPages() {
      try {
        const response = await fetch(repoApiUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Could not load repository contents.");
        }

        const files = await response.json();
        const pages = files
          .filter((file) => file.type === "file")
          .map((file) => file.name)
          .filter((name) => name.toLowerCase().endsWith(".html") && name.toLowerCase() !== "index.html")
          .sort((a, b) => a.localeCompare(b));

        renderPages(pages);
      } catch (error) {
        renderPages(fallbackPages);
      }
    }

    loadPages();
  </script>
</body>
</html>
