<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Page Index</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
    }

    button {
      margin: 0 0 24px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #1261a6;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover,
    button:focus {
      background: #0e4d84;
      outline: none;
    }

    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas 84%);
      border-radius: 8px;
      color: LinkText;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      border-color: LinkText;
      outline: none;
      text-decoration: underline;
    }

    .status {
      padding: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas 84%);
      border-radius: 8px;
      color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
    }
  </style>
</head>
<body>
  <main>
    <h1>HTML Pages</h1>
    <p>All HTML files in this folder, except this index page.</p>
    <button id="choose-folder" type="button">Choose Folder</button>
    <ul id="page-list" aria-live="polite"></ul>
    <div id="status" class="status">Choose this project folder to build the page list.</div>
  </main>

  <script>
    const button = document.querySelector("#choose-folder");
    const list = document.querySelector("#page-list");
    const status = document.querySelector("#status");

    function renderPages(pages) {
      list.innerHTML = "";

      if (!pages.length) {
        status.hidden = false;
        status.textContent = "No other HTML pages were found.";
        return;
      }

      status.hidden = true;

      for (const page of pages) {
        const item = document.createElement("li");
        const link = document.createElement("a");

        link.href = page;
        link.textContent = page;
        item.append(link);
        list.append(item);
      }
    }

    async function loadPagesFromFolder(directoryHandle) {
      const pages = [];

      for await (const [name, handle] of directoryHandle.entries()) {
        if (handle.kind === "file" && name.toLowerCase().endsWith(".html") && name.toLowerCase() !== "index.html") {
          pages.push(name);
        }
      }

      renderPages(pages.sort((a, b) => a.localeCompare(b)));
    }

    if ("showDirectoryPicker" in window) {
      button.addEventListener("click", async () => {
        try {
          const directoryHandle = await window.showDirectoryPicker();
          await loadPagesFromFolder(directoryHandle);
        } catch (error) {
          if (error.name !== "AbortError") {
            status.textContent = "The folder could not be read by this browser.";
          }
        }
      });
    } else {
      button.hidden = true;
      status.textContent = "This browser cannot read a folder from an HTML page. Use Chrome or Edge, or run a small server that creates the page list.";
    }
  </script>
</body>
</html>
